
name: Build NOVA Client

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build NOVA
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-Client-JAR
          path: build/libs/*.jar
          
